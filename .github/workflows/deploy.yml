name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit test math generators, answer checking and coin rules
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Never ship JS that iOS 12 Safari (old iPad mini) can't parse.
      - name: Check legacy bundle (no ?. / ??, ES2017 syntax only)
        run: npm run check:legacy

      - name: Smoke test built game in headless Chrome
        run: npm run test:smoke
        env:
          SMOKE_SCREENSHOTS: smoke-screenshots

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-screenshots
          if-no-files-found: ignore

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
