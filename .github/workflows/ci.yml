name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check legacy bundle (no ?. / ??, ES2017 syntax only)
        run: npm run check:legacy

      - name: Smoke test built game in headless Chrome
        run: npm run test:smoke
        env:
          SMOKE_SCREENSHOTS: smoke-screenshots

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-screenshots
          if-no-files-found: ignore
